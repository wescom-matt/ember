; Outpost 2.0 starter for the Heltec WiFi LoRa 32 V4-R8 (planned; Ember template).
; No official PlatformIO board exists for the V4 or V4-R8 yet, so this folder carries
; an Ember custom board (boards/) and pin variant (variants/). Same SDK lane as Outpost's
; ship env: pioarduino 55.03.312 = Arduino-ESP32 3.3.12 / ESP-IDF 5.5.
[platformio]
boards_dir = boards
default_envs = heltec_v4r8

[env:heltec_v4r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.12/esp32-core-3.3.12-libs.tar.xz
board = heltec_wifi_lora_32_V4R8
board_build.variants_dir = variants
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=3
build_unflags = -std=gnu++11
lib_ignore = BLE
lib_deps =
    jgromes/RadioLib@^7.1.0
    bblanchon/ArduinoJson@^7.1.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.14.5
    h2zero/NimBLE-Arduino@^2.5.1
