[project]
name = "ember"
dynamic = ["version"]
description = "Offline Grok Bot-style chat for the Nomad box"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
# coldboot/stack holds vendored copies of the live P1 tools; kept byte-identical.
extend-exclude = ["coldboot/stack"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "SIM", "I"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/make_preview.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "coldboot/stack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
